# Weekly dependency and GitHub Actions updates, opened as pull requests.
# No workflow runs on pull requests, so before merging one: check out its
# branch and run `npm ci && npm run build && npm run qa`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
