# Weekly dependency and GitHub Actions updates, opened as pull requests.
# No workflow runs on pull requests, so before merging one: check out its
# branch and run `npm ci && npm run build && npm run qa`. For a PR under
# signalrig/ or yetour/, run `npm ci && npm run build` in that folder instead.
# The cooldown holds back versions published in the last week, the window in
# which compromised npm releases are usually caught; security updates skip it.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/signalrig", "/yetour"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @astrojs/check (run by `npm run build`) supports TypeScript 5 and 6 only;
      # remove this once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # signalrig: @types/node must match the Node major it runs on in Vercel
      # production (24.x), or code type-checks against APIs that aren't there.
      # Raise it by hand when the Vercel project's Node version changes.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # signalrig: eslint-config-next's react, jsx-a11y and import plugins have
      # no ESLint 10 releases yet (it shims them; peers stay invalid). Lint only,
      # so stay on 9 until those plugins catch up.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
