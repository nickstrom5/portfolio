# Weekly dependency and GitHub Actions updates, opened as pull requests.
# No workflow runs on pull requests, so before merging one: check out its
# branch and run `npm ci && npm run build && npm run qa`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @astrojs/check (run by `npm run build`) supports TypeScript 5 and 6 only;
      # remove this once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
