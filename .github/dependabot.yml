# Weekly dependency and GitHub Actions updates, opened as pull requests.
# .github/workflows/ci.yml builds and tests each one; merge when it passes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # @astrojs/check does not support TypeScript 7 yet. Remove once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
