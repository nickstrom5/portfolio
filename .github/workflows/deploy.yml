name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs third-party install scripts) can only
# read; only the deploy job can write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the sitemap's <lastmod> dates come from git.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Until the custom domain is live, Pages serves from
      # https://<user>.github.io/<repo>/ and needs a base path. Once
      # public/CNAME exists these two variables can be removed.
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          # Cloudflare Web Analytics site token; unset builds ship no beacon.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tells Bing and the other IndexNow engines which pages this deploy changed (sitemap
  # <lastmod> in the last 6 hours), so they re-crawl in minutes. Google reads the sitemap.
  # A failure here never fails the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            public
      - name: Submit changed pages
        run: |
          sleep 60 # let Pages serve the new sitemap
          urls=$(curl -fsS "https://$(cat public/CNAME)/sitemap-0.xml" | python3 -c '
          import re, sys
          from datetime import datetime, timedelta, timezone
          cutoff = datetime.now(timezone.utc) - timedelta(hours=6)
          for loc, mod in re.findall(r"<loc>([^<]+)</loc><lastmod>([^<]+)</lastmod>", sys.stdin.read()):
              if datetime.fromisoformat(mod.replace("Z", "+00:00")) >= cutoff:
                  print(loc)
          ')
          if [ -n "$urls" ]; then bash scripts/indexnow.sh $urls; else echo "No pages changed in this deploy."; fi
